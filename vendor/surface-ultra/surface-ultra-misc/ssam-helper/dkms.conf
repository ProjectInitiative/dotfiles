PACKAGE_NAME="n1x-ssam-helper"
PACKAGE_VERSION="1.0"
MAKE[0]="make -C ${kernel_source_dir} KERNELRELEASE=${kernelver} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
