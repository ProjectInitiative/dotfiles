# libcamera global configuration for the Surface Laptop Ultra cameras.
# surface_ultra_cam registers its media graph as "mtk-seninf" (modprobe.conf),
# which libcamera's simple pipeline lists with the software ISP off, for
# MediaTek boards that have a hardware converter. This one has none: turn the
# software ISP on so that the front camera's raw Bayer becomes an image.
version: 1
configuration:
  pipelines:
    simple:
      supported_devices:
        - driver: mtk-seninf
          software_isp: true
