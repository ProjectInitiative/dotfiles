# Surface Laptop Ultra cameras
# boot the CCU firmware (nvCCU.img from the Windows driver store) when ROT0 probes
options surface_ccu_boot go=1
# the sensor is driven by surface_ultra_cam; the stock driver only fights over its GPIOs
blacklist ov02c10
# libcamera's simple pipeline handler picks devices by media driver name and has
# no entry for this driver yet; it lists MediaTek's seninf, which this hardware
# is, so take that name (libcamera/configuration.yaml turns its software ISP on)
options surface_ultra_cam mdev_name=mtk-seninf
