# Surface Laptop Ultra: name the two libcamera cameras. libcamera reports both
# as front-facing, so WirePlumber would call both "Built-in Front Camera".
monitor.libcamera.rules = [
  {
    matches = [ { node.name = "~libcamera_input.*_ov02c10" } ]
    actions = { update-props = { node.description = "Surface Front Camera" } }
  }
  {
    matches = [ { node.name = "~libcamera_input.*_vd55g1" } ]
    actions = { update-props = { node.description = "Surface IR Camera" } }
  }
]
