# Microsoft Surface Laptop Ultra (NVIDIA N1X / MT8901 SoundWire)
# Local profile; selected by card long name before the generic
# mt8901-soundwir.conf dispatcher (which would pick the rt712 refboard file).
# Topology (link 0 only): 2x RT1320 (uid 0x30/0x32), RT721 (uid 0x30).
# Internal mic array = RT1320 uid 0x30 DMIC function (ACPI SPD0.AF02).
Syntax 4
Comment "Surface Laptop Ultra MT8901 SoundWire"

SectionUseCase."HiFi" {
	File "/conf.d/mt8901-soundwir/HiFi-surface-laptop-ultra.conf"
	Comment "Play HiFi quality music"
}
