# [audio] Surface Laptop Ultra (N1X/MT8901): SoundWire link-0 pads need 8 mA
# drive (ACPI CNT0 PinFunction vendor data {0x04,0x08}, ignored by mtk-sdw).
# At the 2 mA default the link never syncs (bus clash/parity, no codec attaches).
softdep soundwire_mtk pre: sdw_pad_drive
options sdw_pad_drive groups=GPIO66,GPIO67 ma=8
