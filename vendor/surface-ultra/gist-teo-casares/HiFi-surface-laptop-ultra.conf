# Microsoft Surface Laptop Ultra. PCMs: 7=UL0 (headset mic), 8=UL1 (internal mic).
# Capture paths, from the card's DAPM graph:
#   internal mic: rt1320-1 DP8-10 Capture -> SDW0_Capture0 -> DP7 -> PDI7 -> I168/I169 -> O020/O021 -> UL1
#   headset mic:  rt721 DP2 Headset Capture -> SDW0_Capture1 -> DP8 -> PDI8 -> I170/I171 -> O018/O019 -> UL0
# Playback [audio]: 0=DL0 speakers (2x RT1320, DP2), 1=DL1 headphone jack (RT721, DP3).

SectionVerb {
	EnableSequence [
		# playback routes [audio]: DL0 -> PDI2 -> DP2 (SDW0_Playback0, RT1320 amps)
		cset "name='O150 I032 Switch' 1"
		cset "name='O151 I033 Switch' 1"
		cset "name='PDI2 Demux' DP2"
		# DL1 -> PDI5 -> DP3 (SDW0_Playback1, RT721 jack on link 0)
		cset "name='O156 I034 Switch' 1"
		cset "name='O157 I035 Switch' 1"
		cset "name='PDI5 Demux' DP3"
		# default capture route (internal mic): without an enabled route
		# the capture PCM fails to open at profile probe
		cset "name='PDI7 Mux' DP7"
		cset "name='O020 I168 Switch' 1"
		cset "name='O021 I169 Switch' 1"
		# headset mic route (UL0) too: every mapped PCM must open at probe,
		# or PipeWire drops the whole verb. Separate O-ports, no conflict.
		cset "name='PDI8 Mux' DP8"
		cset "name='O018 I170 Switch' 1"
		cset "name='O019 I171 Switch' 1"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Mic" {
	Comment "Internal microphone array"
	EnableSequence [
		cset "name='PDI7 Mux' DP7"
		cset "name='O020 I168 Switch' 1"
		cset "name='O021 I169 Switch' 1"
		cset "name='rt1320-1 FU Capture Switch' 1"
		# 23 = 0 dB (chip default); about -51 dBFS room noise at 0 dB
		cset "name='rt1320-1 FU Capture Volume' 35,35,35,35"
	]
	DisableSequence [
		cset "name='rt1320-1 FU Capture Switch' 0"
	]
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},8"
		CaptureChannels 2
		CaptureMixerElem "rt1320-1 FU"
	}
}

SectionDevice."Headset" {
	Comment "Headset microphone (jack)"
	EnableSequence [
		cset "name='Headset Mic Switch' 1"
		cset "name='rt721 FU0F Capture Switch' 1"
		cset "name='rt721 FU0F Capture Volume' 58,58"
		cset "name='PDI8 Mux' DP8"
		cset "name='O018 I170 Switch' 1"
		cset "name='O019 I171 Switch' 1"
	]
	DisableSequence [
		cset "name='rt721 FU0F Capture Switch' 0"
		cset "name='Headset Mic Switch' 0"
		# keep the O018/O019 route so the PCM still opens
	]
	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},7"
		CaptureChannels 2
		CaptureMixerElem "rt721 FU0F"
		JackControl "Headset Mic Jack"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"
	EnableSequence [
		cset "name='Speaker Switch' 1"
		cset "name='rt1320-1 OT23 L Switch' 1"
		cset "name='rt1320-1 OT23 R Switch' 1"
		cset "name='rt1320-2 OT23 L Switch' 1"
		cset "name='rt1320-2 OT23 R Switch' 1"
		# SAFETY: no Realtek DSP tuning/speaker protection (RAE .dat, R0
		# calibration) is loaded on Linux, so the amp gain is capped at
		# 75 = -9 dB (87 = 0 dB is NVIDIA's reference-board value).
		# PipeWire uses software volume below this cap.
		cset "name='rt1320-1 FU21 Playback Volume' 75,75"
		cset "name='rt1320-2 FU21 Playback Volume' 75,75"
	]
	DisableSequence [
		cset "name='rt1320-1 OT23 L Switch' 0"
		cset "name='rt1320-1 OT23 R Switch' 0"
		cset "name='rt1320-2 OT23 L Switch' 0"
		cset "name='rt1320-2 OT23 R Switch' 0"
		cset "name='Speaker Switch' 0"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Headphones" {
	Comment "Headphone jack"
	EnableSequence [
		cset "name='Headphone Switch' 1"
		cset "name='rt721 FU05 Playback Volume' 87,87"
	]
	DisableSequence [
		cset "name='Headphone Switch' 0"
	]
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		PlaybackChannels 2
		PlaybackMixerElem "rt721 FU05"
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}
